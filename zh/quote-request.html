.step-content{flex:1}

.summary-box{background:#E8EEFF;border-left:4px solid #1F3AA0;padding:16px;border-radius:0 6px 6px 0;margin-top:16px;font-size:13px}
.summary-box strong{color:#1F3AA0}
footer{background:#0A0E1A;color:#aaa;padding:32px 40px;text-align:center;font-size:12px;margin-top:48px}
